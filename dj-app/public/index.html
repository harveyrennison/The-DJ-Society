<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- 🔑 Vite removes %PUBLIC_URL%. Assets in the public folder are referenced directly by the root path. -->
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="DJ Society website"
    />
    
    <!-- 
      Manifest is handled by Vite if placed in the public folder (or root).
      Vite does not use %PUBLIC_URL%.
    -->
    <link rel="manifest" href="/manifest.json" />

    <title>The DJ Society</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- This is the container for your React application -->
    <div id="root"></div>
    

    <script type="module" src="/src/main.tsx"></script>
    
  </body>
</html>
